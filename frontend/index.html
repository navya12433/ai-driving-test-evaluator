<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driving Test Evaluation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="dashboard">
        <header class="dashboard__header">
            <p class="dashboard__eyebrow">Automated assessment</p>
            <h1 class="dashboard__title">AI Driving Test Evaluation</h1>
            <p class="dashboard__subtitle">Upload a driving test recording to generate a scored report.</p>
        </header>

        <section class="upload-slot">
            <label for="videoUpload" class="upload-slot__label">
                <span class="upload-slot__icon">&#9654;</span>
                <span id="fileName" class="upload-slot__filename">Choose a video file</span>
            </label>
            <input type="file" id="videoUpload" accept="video/*" class="upload-slot__input">
            <button id="evaluateBtn" class="upload-slot__button">Evaluate</button>
        </section>

        <section id="results" class="results" aria-live="polite"></section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
